# pyproject.toml
[project]
name = "graphora-backend"
version = "0.1.0"
description = "FastAPI backend for Graphora"
readme = "../Readme.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Abhiram", email = ""}]

[project.dependencies]
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = {extras = ["email"], version = "^2.8.2"}
structlog = "^24.1.0"
asyncpg = "^0.29.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
alembic = "^1.13.2"
redis = "^5.0.5"
celery = "^5.4.0"
httpx = "^0.27.0"
python-dotenv = "^1.0.1"
neo4j = "^5.18.0"
qdrant-client = "^1.10.0"
# LM Studio OpenAI compatible client will be used via httpx

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
